# zc5s · M2.7 双副本本机负载均衡(nginx)。两副本都在本机(:8001 :8002)→ 聚成 :8000
events { worker_connections 1024; }
http {
  upstream m2 {
    least_conn;
    server 127.0.0.1:8001 max_fails=2 fail_timeout=30s;   # 副本A(卡0-3)
    server 127.0.0.1:8002 max_fails=2 fail_timeout=30s;   # 副本B(卡4-7)
  }
  server {
    listen 8000;
    location / {
      proxy_pass http://m2;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;              # ★ 流式 SSE 必须关
      proxy_read_timeout 600s;
    }
  }
}
