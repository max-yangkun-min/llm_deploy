# 方案三 · M2.7 双副本负载均衡(nginx)。把两台的 :8000 聚成一个入口。
# run.sh将容器内8000映射为宿主机9000,避免和本机M2.7的8000冲突。
events { worker_connections 1024; }
http {
  upstream m2 {
    least_conn;
    server 10.0.0.1:8000 max_fails=2 fail_timeout=30s;   # 机器A M2.7 副本
    server 10.0.0.2:8000 max_fails=2 fail_timeout=30s;   # 机器B M2.7 副本
  }
  server {
    listen 8000;
    location / {
      proxy_pass http://m2;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;              # ★ 流式 SSE 必须关
      proxy_read_timeout 600s;
    }
  }
}
